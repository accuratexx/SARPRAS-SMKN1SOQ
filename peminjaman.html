<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Peminjaman | Sapras Sekolah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="header-container"></div>

    <main class="container my-4 flex-grow-1">
        <h1 class="h3 fw-bold mb-3">Peminjaman dan Pengembalian</h1>
        <div class="card p-4 mb-4 shadow-sm">
            <h2 class="h5">Catat Peminjaman</h2>
            <form id="pinjamForm" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Barang</label>
                    <select class="form-select" id="pinjam_barang_id" required><option value="">Pilih barang</option></select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nama Peminjam</label>
                    <input type="text" class="form-control" id="nama_peminjam" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Kelas / Bagian</label>
                    <input type="text" class="form-control" id="kelas_bagian" placeholder="XI RPL / Guru">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Jumlah</label>
                    <input type="number" class="form-control" id="pinjam_jumlah" min="1" value="1" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Tanggal Pinjam</label>
                    <input type="date" class="form-control" id="tanggal_pinjam" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Rencana Kembali</label>
                    <input type="date" class="form-control" id="tanggal_kembali_rencana" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Tujuan Peminjaman</label>
                    <textarea class="form-control" id="tujuan" rows="2"></textarea>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Simpan Peminjaman</button>
                </div>
            </form>
        </div>

        <div class="card p-3 shadow-sm">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Barang</th>
                            <th>Peminjam</th>
                            <th>Jumlah</th>
                            <th>Tanggal Pinjam</th>
                            <th>Rencana Kembali</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelPinjam"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        if (!localStorage.getItem('user')) { window.location.href = 'login.html'; }
        document.getElementById('tanggal_pinjam').valueAsDate = new Date();

        async function loadIncludes() {
            const hRes = await fetch('header.html');
            document.getElementById('header-container').innerHTML = await hRes.text();
            const fRes = await fetch('footer.html');
            document.getElementById('footer-container').innerHTML = await fRes.text();
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        async function loadSelectPinjam() {
            const { data } = await db.from('barang').select('id, kode_barang, nama_barang, jumlah').order('nama_barang');
            const select = document.getElementById('pinjam_barang_id');
            data?.forEach(b => {
                select.innerHTML += `<option value="${b.id}">${b.kode_barang} - ${b.nama_barang} (tersedia tercatat: ${b.jumlah})</option>`;
            });
        }

        async function loadPinjaman() {
            const { data } = await db.from('peminjaman').select('*, barang(kode_barang, nama_barang)').order('id', { ascending: false });
            const tbody = document.getElementById('tabelPinjam');
            tbody.innerHTML = '';
            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-secondary py-4">Belum ada data peminjaman.</td></tr>`;
                return;
            }
            data.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.barang?.kode_barang} - ${p.barang?.nama_barang}</td>
                        <td>${p.nama_peminjam}<div class="small text-secondary">${p.kelas_bagian || ''}</div></td>
                        <td>${p.jumlah}</td>
                        <td>${p.tanggal_pinjam}</td>
                        <td>${p.tanggal_kembali_rencana}</td>
                        <td>${p.status} ${p.tanggal_kembali ? '<div class="small text-secondary">Kembali: '+p.tanggal_kembali+'</div>' : ''}</td>
                        <td>
                            ${p.status === 'Dipinjam' ? `<button class="btn btn-sm btn-success" onclick="kembalikan(${p.id})">Tandai Kembali</button>` : '—'}
                        </td>
                    </tr>`;
            });
        }

        document.getElementById('pinjamForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await db.from('peminjaman').insert([{
                barang_id: document.getElementById('pinjam_barang_id').value,
                nama_peminjam: document.getElementById('nama_peminjam').value,
                kelas_bagian: document.getElementById('kelas_bagian').value,
                jumlah: parseInt(document.getElementById('pinjam_jumlah').value),
                tanggal_pinjam: document.getElementById('tanggal_pinjam').value,
                tanggal_kembali_rencana: document.getElementById('tanggal_kembali_rencana').value,
                tujuan: document.getElementById('tujuan').value,
                status: 'Dipinjam'
            }]);
            document.getElementById('pinjamForm').reset();
            document.getElementById('tanggal_pinjam').valueAsDate = new Date();
            loadPinjaman();
        });

        async function kembalikan(id) {
            if (confirm('Catat barang sudah dikembalikan?')) {
                const tglHariIni = new Date().toISOString().split('T')[0];
                await db.from('peminjaman').update({ status: 'Dikembalikan', tanggal_kembali: tglHariIni }).eq('id', id);
                loadPinjaman();
            }
        }

        loadIncludes();
        loadSelectPinjam();
        loadPinjaman();
    </script>
</body>
</html>
