<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Sapras Sekolah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="h3 fw-bold">Sapras Sekolah</h1>
            <p class="text-secondary">Masuk untuk mengelola fasilitas sekolah.</p>
            <div id="errorAlert" class="alert alert-danger d-none"></div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <p class="small text-secondary mt-3 mb-0">Akun dibuat oleh admin sistem.</p>
        </div>
        <p class="text-center mt-3">Belum punya akun? <a href="register.html">Daftar sekarang</a></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');

            const { data, error } = await db
                .from('users')
                .select('*')
                .eq('username', username)
                .single();

            if (error || !data || data.password !== password) {
                errorAlert.textContent = 'Username atau password salah.';
                errorAlert.classList.remove('d-none');
                return;
            }

            localStorage.setItem('user', JSON.stringify({ id: data.id, nama: data.nama, role: data.role }));
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
