<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventaris | Sapras Sekolah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="header-container"></div>

    <main class="container my-4 flex-grow-1">
        <h1 class="h3 fw-bold mb-3">Inventaris Barang</h1>
        <div class="card p-4 mb-4 shadow-sm">
            <h2 class="h5" id="formTitle">Tambah barang</h2>
            <form id="barangForm" class="row g-3">
                <input type="hidden" id="barangId">
                <div class="col-md-3">
                    <label class="form-label">Kode barang</label>
                    <input type="text" class="form-control" id="kode_barang" placeholder="INV-001" required>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Nama barang</label>
                    <input type="text" class="form-control" id="nama_barang" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Kategori</label>
                    <input type="text" class="form-control" id="kategori" placeholder="Elektronik, mebel, dll." required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Lokasi</label>
                    <input type="text" class="form-control" id="lokasi" placeholder="Lab RPL" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Jumlah</label>
                    <input type="number" class="form-control" id="jumlah" min="1" value="1" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Kondisi</label>
                    <select class="form-select" id="kondisi">
                        <option value="Baik">Baik</option>
                        <option value="Rusak Ringan">Rusak Ringan</option>
                        <option value="Rusak Berat">Rusak Berat</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Tanggal pengadaan</label>
                    <input type="date" class="form-control" id="tanggal_pengadaan">
                </div>
                <div class="col-12">
                    <label class="form-label">Keterangan</label>
                    <textarea class="form-control" id="keterangan" rows="2"></textarea>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Simpan barang</button>
                    <button type="button" class="btn btn-light d-none" id="btnBatal" onclick="resetForm()">Batal edit</button>
                </div>
            </form>
        </div>

        <div class="card p-3 shadow-sm">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Kode</th>
                            <th>Barang</th>
                            <th>Kategori</th>
                            <th>Lokasi</th>
                            <th>Jumlah</th>
                            <th>Kondisi</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelBarang"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        if (!localStorage.getItem('user')) { window.location.href = 'login.html'; }

        async function loadIncludes() {
            const hRes = await fetch('includes/header.html');
            document.getElementById('header-container').innerHTML = await hRes.text();
            const fRes = await fetch('includes/footer.html');
            document.getElementById('footer-container').innerHTML = await fRes.text();
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        async function loadBarang() {
            const { data } = await db.from('barang').select('*').order('id', { ascending: false });
            const tbody = document.getElementById('tabelBarang');
            tbody.innerHTML = '';
            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-secondary py-4">Belum ada barang. Tambahkan lewat formulir di atas.</td></tr>`;
                return;
            }
            data.forEach(b => {
                tbody.innerHTML += `
                    <tr>
                        <td>${b.kode_barang}</td>
                        <td>${b.nama_barang}</td>
                        <td>${b.kategori}</td>
                        <td>${b.lokasi}</td>
                        <td>${b.jumlah}</td>
                        <td>${b.kondisi}</td>
                        <td class="text-nowrap">
                            <button class="btn btn-sm btn-outline-primary" onclick="editBarang(${b.id}, '${b.kode_barang}', '${b.nama_barang}', '${b.kategori}', '${b.lokasi}', ${b.jumlah}, '${b.kondisi}', '${b.tanggal_pengadaan || ''}', '${b.keterangan || ''}')">Edit</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="hapusBarang(${b.id})">Hapus</button>
                        </td>
                    </tr>`;
            });
        }

        document.getElementById('barangForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('barangId').value;
            const payload = {
                kode_barang: document.getElementById('kode_barang').value,
                nama_barang: document.getElementById('nama_barang').value,
                kategori: document.getElementById('kategori').value,
                lokasi: document.getElementById('lokasi').value,
                jumlah: parseInt(document.getElementById('jumlah').value),
                kondisi: document.getElementById('kondisi').value,
                tanggal_pengadaan: document.getElementById('tanggal_pengadaan').value || null,
                keterangan: document.getElementById('keterangan').value
            };

            if (id) {
                await db.from('barang').update(payload).eq('id', id);
            } else {
                await db.from('barang').insert([payload]);
            }
            resetForm();
            loadBarang();
        });

        function editBarang(id, kode, nama, kat, lok, jum, kon, tgl, ket) {
            document.getElementById('barangId').value = id;
            document.getElementById('kode_barang').value = kode;
            document.getElementById('nama_barang').value = nama;
            document.getElementById('kategori').value = kat;
            document.getElementById('lokasi').value = lok;
            document.getElementById('jumlah').value = jum;
            document.getElementById('kondisi').value = kon;
            document.getElementById('tanggal_pengadaan').value = tgl;
            document.getElementById('keterangan').value = ket;
            document.getElementById('formTitle').textContent = 'Edit barang';
            document.getElementById('btnBatal').classList.remove('d-none');
        }

        function resetForm() {
            document.getElementById('barangForm').reset();
            document.getElementById('barangId').value = '';
            document.getElementById('formTitle').textContent = 'Tambah barang';
            document.getElementById('btnBatal').classList.add('d-none');
        }

        async function hapusBarang(id) {
            if (confirm('Hapus barang ini?')) {
                await db.from('barang').delete().eq('id', id);
                loadBarang();
            }
        }

        loadIncludes();
        loadBarang();
    </script>
</body>
</html>
