<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Sapras Sekolah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <h2 class="text-center text-primary mb-1">Register Akun</h2>
            <p class="text-center text-secondary mb-3">Manajemen Sarana dan Prasarana Sekolah</p>
            <div id="alertMsg" class="alert d-none"></div>
            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label">Nama lengkap</label>
                    <input type="text" class="form-control" id="nama" maxlength="100" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" maxlength="50" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" minlength="8" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Konfirmasi password</label>
                    <input type="password" class="form-control" id="konfirmasi" minlength="8" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Daftar Sekarang</button>
            </form>
            <div class="text-center mt-3">Sudah punya akun? <a href="login.html">Login di sini</a></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nama = document.getElementById('nama').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const konfirmasi = document.getElementById('konfirmasi').value;
            const alertMsg = document.getElementById('alertMsg');

            if (password !== konfirmasi) {
                alertMsg.className = 'alert alert-danger';
                alertMsg.textContent = 'Konfirmasi password tidak cocok.';
                alertMsg.classList.remove('d-none');
                return;
            }

            const { error } = await db.from('users').insert([{
                nama, username, password, role: 'petugas'
            }]);

            if (error) {
                alertMsg.className = 'alert alert-danger';
                alertMsg.textContent = 'Registrasi gagal. Username mungkin sudah digunakan.';
                alertMsg.classList.remove('d-none');
            } else {
                alertMsg.className = 'alert alert-success';
                alertMsg.textContent = 'Registrasi berhasil! Silakan login.';
                alertMsg.classList.remove('d-none');
                setTimeout(() => window.location.href = 'login.html', 1500);
            }
        });
    </script>
</body>
</html>
